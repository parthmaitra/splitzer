spring.application.name=splitzer
app.jwt.secret=${JWT_SECRET:/hWBg6HsqoNW2VUYQwAvrn0QeHbrR+JV84hcMdEuCok=}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/splitzer}
